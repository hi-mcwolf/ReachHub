<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>任务记录 · 触达 · Digiplus</title>
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <div class="app-layout">
    <aside id="sidebar"></aside>
    <div class="app-content">
      <header id="topbar"></header>
      <div class="content-body">
        <main class="stats-main">

          <!-- 1. 页面标题区 -->
          <div class="stats-header">
            <div>
              <h1 class="page-title">任务记录</h1>
              <p class="page-desc">查看触达任务的配置、执行状态和基础效果</p>
            </div>
            <div class="stats-header-actions">
              <span class="update-time" id="updateTime">2026-07-13 02:30 更新</span>
              <button class="btn btn-outline" id="exportBtn"><i data-lucide="download"></i>导出</button>
              <a class="btn btn-primary" href="index.html"><i data-lucide="plus"></i>新建任务</a>
            </div>
          </div>

          <!-- 2. 筛选区 -->
          <section class="card filter-card">
            <div class="filter-row">
              <div class="filter-item">
                <span class="filter-label">时间范围</span>
                <div class="seg-group" id="timeRange">
                  <button class="seg-btn" data-range="today">今天</button>
                  <button class="seg-btn active" data-range="7d">最近7天</button>
                  <button class="seg-btn" data-range="30d">最近30天</button>
                  <button class="seg-btn" data-range="custom">自定义</button>
                </div>
                <div class="date-range" id="customDates" hidden>
                  <input type="date" class="input" value="2026-07-01">
                  <span class="date-sep">至</span>
                  <input type="date" class="input" value="2026-07-13">
                </div>
              </div>
              <div class="filter-item">
                <span class="filter-label">任务名称/ID</span>
                <input class="input" id="fName" placeholder="输入任务名称或 ID 搜索">
              </div>
              <div class="filter-item">
                <span class="filter-label">任务code</span>
                <input class="input" id="fTaskCode" placeholder="输入任务code搜索">
              </div>
              <div class="filter-item">
                <span class="filter-label">内容</span>
                <input class="input" id="fContent" placeholder="输入内容关键词搜索">
              </div>
              <div class="filter-item">
                <span class="filter-label">任务类型</span>
                <select class="select" id="fType">
                  <option value="">全部</option><option>系统调用</option><option>手动发送</option>
                </select>
              </div>
              <div class="filter-item filter-item-wide">
                <span class="filter-label">产品线</span>
                <div id="fProductLine"></div>
              </div>
              <div class="filter-item">
                <span class="filter-label">通道</span>
                <select class="select" id="fChannel">
                  <option value="">全部</option><option>SMS</option><option>邮件</option><option>Push</option>
                  <option>Inbox</option><option>IM</option><option>Bot</option>
                  <option>Viber</option><option>Messenger</option><option>WhatsApp</option><option>电销</option>
                </select>
              </div>
              <div class="filter-item">
                <span class="filter-label">任务状态</span>
                <select class="select" id="fStatus">
                  <option value="">全部</option>
                  <option value="pending">待发送</option>
                  <option value="running">发送中/已启用</option>
                  <option value="done">已完成</option>
                  <option value="stopped">已终止</option>
                </select>
              </div>
              <div class="filter-item">
                <span class="filter-label">审批状态</span>
                <select class="select" id="fApproval">
                  <option value="">全部</option><option value="pending">待审批</option>
                  <option value="approved">已通过</option><option value="rejected">已拒绝</option>
                </select>
              </div>
              <div class="filter-item">
                <span class="filter-label">任务来源</span>
                <select class="select" id="fParty">
                  <option value="">全部来源</option><option>自营平台</option><option>渠道 A</option><option>渠道 B</option>
                </select>
              </div>
              <div class="filter-item">
                <span class="filter-label">审批人</span>
                <input class="input" id="fApprover" placeholder="输入审批人搜索">
              </div>
              <div class="filter-item">
                <span class="filter-label">创建人</span>
                <select class="select" id="fCreator">
                  <option value="">全部创建人</option><option>marvin@</option><option>lily@</option><option>ken@</option>
                </select>
              </div>
              <div class="filter-actions">
                <button class="btn btn-primary" id="queryBtn">查询</button>
                <button class="btn btn-outline" id="resetBtn">重置</button>
              </div>
            </div>
          </section>

          <!-- 3. 快捷统计区 -->
          <section class="kpi-grid kpi-grid-4" id="kpiGrid"></section>

          <!-- 4. 任务列表表格区 -->
          <section class="card table-card">
            <div class="table-card-head">
              <h4 class="card-title">任务列表</h4>
              <div class="batch-bar" id="batchBar" hidden>
                <span class="batch-count">已选 <b id="batchCount">0</b> 项</span>
                <button class="btn btn-outline btn-sm" data-batch="approve">通过</button>
                <button class="btn btn-outline btn-sm btn-reject" data-batch="reject">拒绝</button>
                <button class="btn btn-outline btn-sm btn-reject" data-batch="stop">终止</button>
              </div>
            </div>
            <div class="table-scroll table-sticky">
              <table class="table stats-table records-table">
                <thead>
                  <tr>
                    <th class="col-check"><input type="checkbox" id="checkAll" aria-label="全选"></th>
                    <th>任务 ID</th><th class="col-name">任务名称</th><th>任务code</th><th>产品线</th><th>发送对象</th><th>通道</th>
                    <th>发送时机</th><th>任务类型</th><th>当前状态</th><th>创建人</th>
                    <th>创建时间</th><th>最近更新人</th><th>最近更新时间</th>
                    <th class="col-ops">操作</th>
                  </tr>
                </thead>
                <tbody id="taskTableBody"></tbody>
              </table>
            </div>
            <div class="table-footer">
              <div class="pagination" id="pagination"></div>
            </div>
          </section>

        </main>
      </div>
    </div>
  </div>

  <!-- 任务详情抽屉 -->
  <div class="drawer-root" id="taskDetailDrawer">
    <div class="drawer-mask" data-close></div>
    <aside class="drawer drawer-lg">
      <header class="drawer-header">
        <h3>任务详情</h3>
        <button class="icon-btn" data-close aria-label="关闭"><i data-lucide="x"></i></button>
      </header>
      <div class="drawer-body drawer-body--gray" id="taskDetailBody"></div>
      <footer class="drawer-footer" id="taskDetailFooter">
        <button class="btn btn-outline" data-close>关闭</button>
        <button class="btn btn-outline" id="detailToSendRecords">查看发送记录</button>
      </footer>
    </aside>
  </div>

  <!-- 编辑任务抽屉（与新建任务同构） -->
  <div class="drawer-root" id="taskDrawer">
    <div class="drawer-mask" data-close></div>
    <aside class="drawer drawer-xl">
      <header class="drawer-header">
        <h3 id="taskDrawerTitle">编辑任务</h3>
        <button class="icon-btn" data-close aria-label="关闭"><i data-lucide="x"></i></button>
      </header>

      <div class="nt-cols">
        <section class="nt-preview">
          <div class="pane-caption">预览</div>
          <div id="ntPreview"></div>
        </section>

        <section class="nt-config">
          <div class="field">
            <span class="field-label">名称</span>
            <input class="input" id="ntName" placeholder="请输入名称">
          </div>

          <div class="field">
            <span class="field-label">产品线</span>
            <select class="select" id="ntProductLine">
              <option value="">请选择产品线</option>
              <option value="BP-VIP">BP-VIP</option>
              <option value="BingoPlus">BingoPlus</option>
              <option value="BP-CONTENT OPERATION CENTER">BP-CONTENT OPERATION CENTER</option>
            </select>
          </div>

          <div class="field">
            <span class="field-label">任务类型</span>
            <div class="radio-group" id="ntTaskType">
              <label><input type="radio" name="taskType" value="manual" checked>手动发送</label>
              <label><input type="radio" name="taskType" value="system">系统调用</label>
            </div>
          </div>

          <div class="field" id="ntAudienceField">
            <span class="field-label">人群（Who）</span>
            <div class="cfg-row" id="rowAudience">
              <div class="cfg-value" id="audienceValue"><span class="placeholder">请选择人群</span></div>
              <i data-lucide="chevron-right"></i>
            </div>
          </div>

          <div class="field" id="ntTimingField">
            <span class="field-label">时间（When）</span>
            <div class="cfg-row" id="rowTiming">
              <div class="cfg-value" id="timingValue"><span class="placeholder">请选择发送时机</span></div>
              <i data-lucide="chevron-right"></i>
            </div>
          </div>

          <div class="field" id="ntTaskCodeField" hidden>
            <span class="field-label">任务code</span>
            <input class="input" id="ntTaskCode" placeholder="请输入任务code">
          </div>

          <div class="field">
            <span class="field-label">内容（What）</span>
            <div class="cfg-row" id="rowContent">
              <div class="cfg-value" id="contentValue"><span class="placeholder">请配置发送内容</span></div>
              <i data-lucide="chevron-right"></i>
            </div>
          </div>

          <div class="field" hidden>
            <span class="field-label">触达策略</span>
            <div class="cfg-row" id="rowStrategy">
              <div class="cfg-value" id="strategyValue"><span class="placeholder">请选择触达策略</span></div>
              <i data-lucide="chevron-right"></i>
            </div>
          </div>
        </section>

        <section class="nt-panel" id="ntPanel">
          <div class="panel-empty">点击左侧配置项查看详情</div>
        </section>
      </div>

      <footer class="drawer-footer">
        <button class="btn btn-outline" data-close>取消</button>
        <button class="btn btn-primary" id="createTaskBtn">保存</button>
      </footer>
    </aside>
  </div>

  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="assets/common.js"></script>
  <script src="assets/content-editor.js"></script>
  <script src="assets/reach-config.js"></script>
  <script src="assets/search-select.js"></script>
  <script src="assets/search-multi-select.js"></script>
  <script src="assets/strategy-data.js"></script>
  <script src="assets/reach.js"></script>
  <script src="assets/task-records.js"></script>
</body>
</html>
