<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>发送记录 · 触达 · Digiplus</title>
  <link rel="stylesheet" href="assets/styles.css?v=202611251417">
  <link rel="stylesheet" href="assets/v2.css?v=202611251417">
  <link rel="stylesheet" href="assets/task-records-v2.css?v=202611251417">
</head>
<body>
  <div class="app-layout">
    <aside id="sidebar"></aside>
    <div class="app-content">
      <header id="topbar"></header>
      <div class="content-body">
        <main class="stats-main">

          <!-- 1. 页面标题区 -->
          <div class="stats-header">
            <div>
              <h1 class="page-title">发送记录</h1>
              <p class="page-desc">查看每条消息的消息状态、失败分类、原始码与最终供应商</p>
            </div>
            <div class="stats-header-actions">
              <span class="update-time" id="updateTime">2026-07-13 02:30 更新</span>
              <button class="btn btn-primary" id="exportBtn"><i data-lucide="download"></i>导出记录</button>
            </div>
          </div>

          <!-- 2. 筛选区 -->
          <section class="card filter-card">
            <div class="filter-row">
              <div class="filter-item">
                <span class="filter-label">时间范围</span>
                <div class="seg-group" id="timeRange">
                  <button class="seg-btn" data-range="today">今天</button>
                  <button class="seg-btn active" data-range="7d">最近7天</button>
                  <button class="seg-btn" data-range="custom">自定义</button>
                </div>
                <div class="date-range" id="customDates" hidden>
                  <input type="date" class="input" value="2026-07-01">
                  <span class="date-sep">至</span>
                  <input type="date" class="input" value="2026-07-13">
                </div>
              </div>
              <div class="filter-item">
                <span class="filter-label">记录 ID</span>
                <input class="input" id="fRecordId" placeholder="输入记录 ID 搜索">
              </div>
              <div class="filter-item">
                <span class="filter-label">任务名称/ID</span>
                <input class="input" id="fTask" placeholder="输入任务名称或 ID 搜索">
              </div>
              <div class="filter-item">
                <span class="filter-label">任务code</span>
                <input class="input" id="fTaskCode" placeholder="输入任务code搜索">
              </div>
              <div class="filter-item">
                <span class="filter-label">内容</span>
                <input class="input" id="fContent" placeholder="输入内容关键词搜索">
              </div>
              <div class="filter-item">
                <span class="filter-label">活动 ID/名称</span>
                <input class="input" id="fActivity" placeholder="输入活动 ID 或名称搜索">
              </div>
              <div class="filter-item filter-item-wide">
                <span class="filter-label">产品线</span>
                <div id="fProductLine"></div>
              </div>
              <div class="filter-item">
                <span class="filter-label">通道</span>
                <select class="select" id="fChannel">
                  <option value="">全部</option><option>SMS</option><option>邮件</option><option>Push</option>
                  <option>站内信</option><option>IM</option>
                </select>
              </div>
              <div class="filter-item">
                <span class="filter-label">任务类型</span>
                <select class="select" id="fSource">
                  <option value="">全部</option><option value="手动">手动发送</option><option value="API">系统调用</option>
                </select>
              </div>
              <div class="filter-item">
                <span class="filter-label">消息类别</span>
                <select class="select" id="fCategory">
                  <option value="">全部</option><option>OTP</option><option>营销</option>
                </select>
              </div>
              <div class="filter-item">
                <span class="filter-label">消息状态</span>
                <select class="select" id="fStatus"></select>
              </div>
              <div class="filter-item">
                <span class="filter-label">是否兜底</span>
                <select class="select" id="fFbFlag">
                  <option value="">全部</option><option value="origin">原消息</option><option value="fallback">兜底短信</option>
                </select>
              </div>
              <div class="filter-item">
                <span class="filter-label">兜底状态</span>
                <select class="select" id="fFbStatus">
                  <option value="">全部</option><option>无需兜底</option><option>等待中</option><option>已触发</option><option>未触发</option>
                </select>
              </div>
              <div class="filter-item">
                <span class="filter-label">触发原因</span>
                <select class="select" id="fFbReason">
                  <option value="">全部</option><option>回执失败</option><option>超时未回执</option>
                </select>
              </div>
              <div class="filter-item">
                <span class="filter-label">失败分类</span>
                <select class="select" id="fCat"></select>
              </div>
              <div class="filter-item">
                <span class="filter-label">首发 / 重试</span>
                <select class="select" id="fAttempt">
                  <option value="">全部</option><option>首发</option><option>重试</option>
                </select>
              </div>
              <div class="filter-item">
                <span class="filter-label">最终供应商</span>
                <select class="select" id="fVendor"></select>
              </div>
              <div class="filter-item">
                <span class="filter-label">账号/发送方标识</span>
                <select class="select" id="fSender"></select>
              </div>
              <div class="filter-item">
                <span class="filter-label">发送对象</span>
                <input class="input" id="fUser" placeholder="输入发送对象搜索">
              </div>
              <div class="filter-actions">
                <button class="btn btn-primary" id="queryBtn">查询</button>
                <button class="btn btn-outline" id="resetBtn">重置</button>
              </div>
            </div>
          </section>

          <div class="sr-prefilter" id="srPrefilter" hidden></div>

          <!-- 3. 快捷统计区 -->
          <section class="kpi-grid kpi-grid-5" id="kpiGrid"></section>

          <!-- 4. 发送记录表格区 -->
          <section class="card table-card">
            <h4 class="card-title">发送明细</h4>
            <div class="table-scroll table-sticky">
              <table class="table stats-table records-table">
                <thead>
                  <tr>
                    <th>记录 ID</th><th>发送时间</th><th>任务 ID</th><th class="col-name">任务名称</th><th>任务code</th><th>发送对象</th>
                    <th>通道</th><th>最终供应商 / 账号 / 发送方标识</th><th class="col-name">发送内容</th>
                    <th>消息状态</th><th>兜底状态</th><th>兜底信息</th><th>失败分类</th><th>原始码</th><th>首发 / 重试</th><th class="v2-num">计费条数</th>
                    <th>回执 ID</th><th>任务类型</th><th>接入方 / operator</th>
                    <th>活动 ID</th><th class="col-name">活动名称</th>
                    <th class="col-ops">操作</th>
                  </tr>
                </thead>
                <tbody id="recordTableBody"></tbody>
              </table>
            </div>
            <div class="table-footer">
              <div class="pagination" id="pagination"></div>
            </div>
          </section>

        </main>
      </div>
    </div>
  </div>

  <!-- 发送详情抽屉 -->
  <div class="drawer-root" id="sendDetailDrawer">
    <div class="drawer-mask" data-close></div>
    <aside class="drawer drawer-lg">
      <header class="drawer-header">
        <h3>发送详情</h3>
        <button class="icon-btn" data-close aria-label="关闭"><i data-lucide="x"></i></button>
      </header>
      <div class="drawer-body drawer-body--gray" id="sendDetailBody"></div>
      <footer class="drawer-footer">
        <button class="btn btn-outline" data-close>关闭</button>
        <button class="btn btn-outline" id="detailToTask">查看所属任务</button>
      </footer>
    </aside>
  </div>

  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="assets/common.js?v=202611251417"></script>
  <script src="assets/v2-data.js?v=202611251417"></script>
  <script src="assets/content-editor.js?v=202611251417"></script>
  <script src="assets/reach-config.js?v=202611251417"></script>
  <script src="assets/search-select.js?v=202611251417"></script>
  <script src="assets/search-multi-select.js?v=202611251417"></script>
  <script src="assets/task-records-data.js?v=202611251417"></script>
  <script src="assets/send-records.js?v=202611251417"></script>
</body>
</html>
