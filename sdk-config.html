<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SDK · 首页 · 触达中心</title>
  <link rel="stylesheet" href="assets/styles.css?v=202611131750">
  <link rel="stylesheet" href="assets/v2.css?v=202611131750">
  <link rel="stylesheet" href="assets/email-check.css?v=202611131750">
</head>
<body class="sdk-embed">
  <!-- 触达 H5 SDK · 配置弹窗（iframe 页面）：复用触达新建任务弹出层，固定为系统调用 -->
  <div class="drawer-root" id="taskDrawer">
    <div class="drawer-mask" data-close></div>
    <aside class="drawer drawer-xl">
      <header class="drawer-header">
        <h3 id="taskDrawerTitle">新建</h3>
        <button class="icon-btn" data-close aria-label="关闭"><i data-lucide="x"></i></button>
      </header>

      <div class="nt-cols">
        <!-- 左：预览 -->
        <section class="nt-preview">
          <div class="pane-caption">预览</div>
          <div id="ntPreview"></div>
        </section>

        <!-- 中：任务配置 -->
        <section class="nt-config">
          <div class="field">
            <span class="field-label">名称</span>
            <input class="input" id="ntName" placeholder="请输入名称">
          </div>

          <div class="field">
            <span class="field-label">产品线</span>
            <select class="select" id="ntProductLine">
              <option value="">请选择产品线</option>
              <option value="VIP">VIP</option>
              <option value="Growth Center">Growth Center</option>
              <option value="Platform Operation Center">Platform Operation Center</option>
              <option value="Content Operation Center">Content Operation Center</option>
              <option value="ArenaPlus">ArenaPlus</option>
              <option value="GameZone">GameZone</option>
            </select>
          </div>

          <div class="field">
            <span class="field-label">活动名称</span>
            <select class="select" id="ntActivity">
              <option value="">请选择活动</option>
              <option value="ACT202607001">世界杯竞猜预热</option>
              <option value="ACT202607002">充值满赠限时活动</option>
              <option value="ACT202607003">新用户注册礼包</option>
              <option value="ACT202607004">VIP 专属回归礼</option>
              <option value="ACT202607005">每日签到挑战</option>
              <option value="ACT202607006">沉默用户唤醒</option>
              <option value="ACT202607007">生日专属礼包</option>
              <option value="ACT202607008">七月大促预热</option>
            </select>
          </div>

          <div class="field">
            <span class="field-label">任务类型</span>
            <div class="radio-group" id="ntTaskType">
              <label><input type="radio" name="taskType" value="manual" checked>手动发送</label>
              <label><input type="radio" name="taskType" value="system">系统调用</label>
            </div>
          </div>

          <div class="field" id="ntAudienceField">
            <span class="field-label">人群（Who）</span>
            <div class="cfg-row" id="rowAudience">
              <div class="cfg-value" id="audienceValue"><span class="placeholder">请选择人群</span></div>
              <i data-lucide="chevron-right"></i>
            </div>
          </div>

          <div class="field" id="ntTimingField">
            <span class="field-label">时间（When）</span>
            <div class="cfg-row" id="rowTiming">
              <div class="cfg-value" id="timingValue"><span class="placeholder">请选择发送时机</span></div>
              <i data-lucide="chevron-right"></i>
            </div>
          </div>

          <div class="field" id="ntTaskCodeField" hidden>
            <span class="field-label">任务code</span>
            <input class="input" id="ntTaskCode" placeholder="请输入任务code">
          </div>

          <div class="field">
            <span class="field-label">内容（What）</span>
            <div class="cfg-row" id="rowContent">
              <div class="cfg-value" id="contentValue"><span class="placeholder">请配置发送内容</span></div>
              <i data-lucide="chevron-right"></i>
            </div>
          </div>

          <div class="field" hidden>
            <span class="field-label">触达策略</span>
            <div class="cfg-row" id="rowStrategy">
              <div class="cfg-value" id="strategyValue"><span class="placeholder">请选择触达策略</span></div>
              <i data-lucide="chevron-right"></i>
            </div>
          </div>
        </section>

        <!-- 右：配置项内容区（条件显示） -->
        <section class="nt-panel" id="ntPanel">
          <div class="panel-empty">点击左侧配置项查看详情</div>
        </section>
      </div>

      <footer class="drawer-footer">
        <button class="btn btn-outline" data-close>取消</button>
        <button class="btn btn-primary" id="createTaskBtn">提交审批</button>
      </footer>
    </aside>
  </div>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="assets/common.js?v=202611131750"></script>
  <script src="assets/v2-data.js?v=202611131750"></script>
  <script src="assets/content-editor.js?v=202611131750"></script>
  <script src="assets/reach-config.js?v=202611131750"></script>
  <script src="assets/search-select.js?v=202611131750"></script>
  <script src="assets/strategy-data.js?v=202611131750"></script>
  <script src="assets/search-multi-select.js?v=202611131750"></script>
  <script src="assets/email-check.js?v=202611131750"></script>
  <script src="assets/reach.js?v=202611131750"></script>
  <script src="assets/sdk-config.js?v=202611131750"></script>
</body>
</html>
