<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>模板管理 · 触达 · Digiplus</title>
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <div class="app-layout">
    <aside id="sidebar"></aside>
    <div class="app-content">
      <header id="topbar"></header>
      <div class="content-body">
        <main class="stats-main">

          <!-- 1. 页面标题区 -->
          <div class="stats-header">
            <div>
              <h1 class="page-title">模板管理</h1>
              <p class="page-desc">统一管理短信、邮件、Push、站内信、IM、Bot 等渠道模板</p>
            </div>
            <div class="stats-header-actions">
              <span class="update-time" id="updateTime">2026-07-13 03:20 更新</span>
              <button class="btn btn-primary" id="newTplBtn"><i data-lucide="plus"></i>新建模板</button>
            </div>
          </div>

          <!-- 2. 筛选区 -->
          <section class="card filter-card">
            <div class="filter-row">
              <div class="filter-item">
                <span class="filter-label">模板名称</span>
                <input class="input" id="fName" placeholder="输入模板名称搜索">
              </div>
              <div class="filter-item">
                <span class="filter-label">模板ID</span>
                <input class="input" id="fCode" placeholder="输入模板 ID 搜索">
              </div>
              <div class="filter-item">
                <span class="filter-label">产品线</span>
                <select class="select" id="fBiz">
                  <option value="">全部产品线</option>
                  <option>BingoPlus</option><option>ArenaPlus</option><option>BP-VIP</option>
                </select>
              </div>
              <div class="filter-item">
                <span class="filter-label">通道</span>
                <select class="select" id="fChannel">
                  <option value="">全部</option>
                  <option>SMS</option><option>邮件</option><option>Push</option>
                  <option>Viber</option><option>Messenger</option><option>WhatsApp</option>
                  <option>站内信</option>
                </select>
              </div>
              <div class="filter-item">
                <span class="filter-label">创建人</span>
                <select class="select" id="fCreator">
                  <option value="">全部创建人</option>
                  <option>marvin@</option><option>lily@</option><option>ken@</option>
                </select>
              </div>
              <div class="filter-item">
                <span class="filter-label">内容</span>
                <input class="input" id="fContent" placeholder="输入内容关键词搜索">
              </div>
              <div class="filter-actions">
                <button class="btn btn-primary" id="queryBtn">查询</button>
                <button class="btn btn-outline" id="resetBtn">重置</button>
              </div>
            </div>
          </section>

          <!-- 3. 模板列表区 -->
          <section class="card table-card">
            <h4 class="card-title">模板列表</h4>
            <div class="table-scroll table-sticky">
              <table class="table stats-table records-table">
                <thead>
                  <tr>
                    <th>模板 ID</th><th class="col-name">模板名称</th><th>产品线</th><th>通道</th>
                    <th class="col-name">内容</th><th>创建人</th>
                    <th>创建时间</th><th>最近更新人</th><th>最近更新时间</th>
                    <th class="col-ops">操作</th>
                  </tr>
                </thead>
                <tbody id="tplTableBody"></tbody>
              </table>
            </div>
            <div class="table-footer">
              <div class="pagination" id="pagination"></div>
            </div>
          </section>

        </main>
      </div>
    </div>
  </div>

  <!-- 模板详情/编辑抽屉 -->
  <div class="drawer-root" id="tplDrawer">
    <div class="drawer-mask" data-close></div>
    <aside class="drawer drawer-xl tpl-drawer">
      <header class="drawer-header">
        <h3 id="tplDrawerTitle">模板详情</h3>
        <button class="icon-btn" data-close aria-label="关闭"><i data-lucide="x"></i></button>
      </header>
      <div class="tpl-drawer-cols">
        <div class="tpl-drawer-preview">
          <div class="pane-caption">模板预览</div>
          <div id="tplPreview"></div>
        </div>
        <div class="tpl-drawer-form" id="tplDrawerForm"></div>
      </div>
      <footer class="drawer-footer" id="tplDrawerFooter"></footer>
    </aside>
  </div>

  <!-- 新建任务抽屉（从模板带入通道与内容） -->
  <div class="drawer-root" id="taskDrawer">
    <div class="drawer-mask" data-close></div>
    <aside class="drawer drawer-xl">
      <header class="drawer-header">
        <h3 id="taskDrawerTitle">新建触达任务</h3>
        <button class="icon-btn" data-close aria-label="关闭"><i data-lucide="x"></i></button>
      </header>

      <div class="nt-cols">
        <section class="nt-preview">
          <div class="pane-caption">预览</div>
          <div id="ntPreview"></div>
        </section>

        <section class="nt-config">
          <div class="field">
            <span class="field-label">名称</span>
            <input class="input" id="ntName" placeholder="请输入名称">
          </div>

          <div class="field">
            <span class="field-label">产品线</span>
            <select class="select" id="ntProductLine">
              <option value="">请选择产品线</option>
              <option value="BP-VIP">BP-VIP</option>
              <option value="BingoPlus">BingoPlus</option>
              <option value="BP-CONTENT OPERATION CENTER">BP-CONTENT OPERATION CENTER</option>
            </select>
          </div>

          <div class="field">
            <span class="field-label">任务类型</span>
            <div class="radio-group" id="ntTaskType">
              <label><input type="radio" name="taskType" value="manual" checked>手动发送</label>
              <label><input type="radio" name="taskType" value="system">系统调用</label>
            </div>
          </div>

          <div class="field" id="ntAudienceField">
            <span class="field-label">人群（Who）</span>
            <div class="cfg-row" id="rowAudience">
              <div class="cfg-value" id="audienceValue"><span class="placeholder">请选择人群</span></div>
              <i data-lucide="chevron-right"></i>
            </div>
          </div>

          <div class="field" id="ntTimingField">
            <span class="field-label">时间（When）</span>
            <div class="cfg-row" id="rowTiming">
              <div class="cfg-value" id="timingValue"><span class="placeholder">请选择发送时机</span></div>
              <i data-lucide="chevron-right"></i>
            </div>
          </div>

          <div class="field" id="ntTaskCodeField" hidden>
            <span class="field-label">任务code</span>
            <input class="input" id="ntTaskCode" placeholder="请输入任务code">
          </div>

          <div class="field">
            <span class="field-label">内容（What）</span>
            <div class="cfg-row" id="rowContent">
              <div class="cfg-value" id="contentValue"><span class="placeholder">请配置发送内容</span></div>
              <i data-lucide="chevron-right"></i>
            </div>
          </div>

          <div class="field" hidden>
            <span class="field-label">触达策略</span>
            <div class="cfg-row" id="rowStrategy">
              <div class="cfg-value" id="strategyValue"><span class="placeholder">请选择触达策略</span></div>
              <i data-lucide="chevron-right"></i>
            </div>
          </div>
        </section>

        <section class="nt-panel" id="ntPanel">
          <div class="panel-empty">点击左侧配置项查看详情</div>
        </section>
      </div>

      <footer class="drawer-footer">
        <button class="btn btn-outline" data-close>取消</button>
        <button class="btn btn-primary" id="createTaskBtn">提交审批</button>
      </footer>
    </aside>
  </div>

  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="assets/common.js"></script>
  <script src="assets/content-editor.js"></script>
  <script src="assets/reach-config.js"></script>
  <script src="assets/search-select.js"></script>
  <script src="assets/search-multi-select.js"></script>
  <script src="assets/strategy-data.js"></script>
  <script src="assets/reach.js"></script>
  <script src="assets/templates.js"></script>
</body>
</html>
